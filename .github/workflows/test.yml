name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rr_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: rights_reporter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rr_test -d rights_reporter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rr_test:local_ci_only@127.0.0.1:5432/rights_reporter_test
      TEST_DATABASE_ISOLATED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:chrome
      - run: npm run test:ci
      - run: npm run build:extension
